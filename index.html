.w{max-width:960px;margin:0 auto;padding:0 14px}
.bar{display:flex;align-items:center;gap:10px;height:62px}
.bar img{height:42px;border-radius:8px}.bar b{font-size:17px;letter-spacing:.14em;font-weight:800}.bar small{display:block;color:var(--pale);font-size:10px;letter-spacing:.18em;font-weight:500}
.sp{flex:1}
select,button,input{font:inherit;color:inherit}
.bar select,.ib{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:10px;padding:7px 9px;font-weight:600;cursor:pointer}
.bar option{color:#000}
main{padding:16px 14px 40px;max-width:960px;margin:0 auto}
.hero{position:relative;overflow:hidden;background:var(--brand);color:#fff;border-radius:22px;padding:22px;display:grid;gap:16px;border:1px solid rgba(255,255,255,.1)}
.hero .wm{position:absolute;right:-30px;top:-20px;height:230px;opacity:.16;border-radius:20px}
.hero>*{position:relative}
.pill{display:inline-block;background:rgba(255,255,255,.16);padding:4px 11px;border-radius:99px;font-size:12px;font-weight:700;letter-spacing:.05em}
.hero h2{margin:4px 0 0;font-size:clamp(24px,5vw,36px);font-weight:800;line-height:1.1}
.hero .t{color:var(--gold);font-weight:700}.hero .s{color:var(--pale);font-size:13px}
.cd{background:rgba(0,0,0,.22);border-radius:16px;padding:12px 16px;max-width:280px}
.cd .n{font-size:38px;font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums}
.pb{height:7px;border-radius:9px;background:rgba(255,255,255,.2);overflow:hidden}.pb i{display:block;height:100%;background:var(--gold);width:0;transition:width 1s}
.top{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:18px 0 10px;flex-wrap:wrap}
.top h3{margin:0;font-size:20px;font-weight:800}
.clk{font-variant-numeric:tabular-nums;font-weight:700;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 12px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin:10px 0}
.tab{flex:0 0 auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 14px;cursor:pointer;font-weight:600;text-align:center}
.tab small{display:block;font-size:10px;color:var(--mut)}
.tab.on{background:var(--brand);color:#fff;border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}.tab.on small{color:var(--pale)}
input.q{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-bottom:8px}
.c{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:8px}
.c.live{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold);}.c.past{opacity:.5}
.ic{width:38px;height:38px;border-radius:11px;background:var(--chip);display:grid;place-items:center;flex:none;font-size:17px}
.c.lesson .ic{background:var(--brand);color:var(--gold);font-weight:800;font-size:16px}
.c .m{flex:1;min-width:0}.c .m b{display:block;font-size:16px}.c .m span{display:block;color:var(--mut);font-size:14px;overflow-wrap:anywhere;margin-top:2px}
.tm{font-variant-numeric:tabular-nums;font-size:12px;font-weight:700;background:var(--chip);border-radius:9px;padding:4px 8px;white-space:nowrap}
.live .tm{background:var(--gold);color:#3a2a00}
.md{position:fixed;inset:0;background:rgba(2,30,40,.7);display:none;place-items:center;padding:16px;z-index:9}.md.on{display:grid}
.bx{background:var(--card);border-radius:20px;padding:18px;width:100%;max-width:440px;max-height:85vh;overflow:auto;border-top:4px solid var(--gold)}
.bx h4{margin:0 0 10px;font-size:18px}.bx li{padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}.bx ol{padding-left:22px;margin:8px 0}
.bx label{display:block;font-size:12px;font-weight:600;margin:10px 0 4px}.bx select,.bx input{width:100%;padding:8px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.btn{background:var(--brand);color:#fff;border:0;border-radius:11px;padding:9px 14px;font-weight:700;cursor:pointer;margin:12px 6px 0 0}.btn.g{background:var(--chip);color:var(--ink)}
html{-webkit-text-size-adjust:100%}body{overflow-x:hidden;-webkit-tap-highlight-color:transparent}
select,input{font-size:16px}.ib{min-width:44px;min-height:44px;font-size:17px}.tab{min-height:48px;scroll-snap-align:start}.tabs{scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.bx{max-height:85dvh}
@media(max-width:600px){
.bar{flex-wrap:wrap;height:auto;padding:8px 0;row-gap:8px;gap:8px}.bar img{height:36px}.bar b{font-size:15px}.bar small{font-size:9px}
.bar select{order:5;flex:1 1 100%;min-height:44px}.ib{padding:6px}
main{padding:12px 10px 32px}.hero{padding:16px;border-radius:18px;gap:12px}.hero .wm{height:150px;right:-20px;top:-10px}
.cd{max-width:none}.cd .n{font-size:34px}.hero .s{font-size:12px}
.top{margin:14px 0 8px}.top h3{font-size:16px;flex:1 1 100%}.clk{font-size:13px}
.c{padding:10px 11px;gap:10px;border-radius:14px}.ic{width:34px;height:34px}.c .m b{font-size:15px}.c .m span{font-size:13px}.tm{font-size:11px;padding:3px 6px}
.md{align-items:end;padding:0}.bx{max-width:none;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.btn{min-height:44px}}
@media(max-width:360px){.c{flex-wrap:wrap}.tm{margin-left:44px}}
